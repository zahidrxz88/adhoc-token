async function kvGet(key) {
  const { data, error } = await sb.from("kv_store").select("value").eq("key", key).maybeSingle();

}
async function kvSet(key, value) {

}

const MS_DAY = 86400000;
const todayStr = () => new Date().toISOString().slice(0, 10);
const parseD = s => new Date(s + "T00:00:00");
const fmtShort = s => parseD(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const daysBetween = (a, b) => Math.round((b - a) / MS_DAY);

function slotStatus(slot) {
  if (slot.completed) return "done";
  if (!slot.date) return "unselected";
  const today = parseD(todayStr());
  const d = parseD(slot.date);
  const diff = daysBetween(today, d);
  if (diff < 0) return "overdue";
  if (diff <= 30) return "due-soon";
  return "scheduled";
}

};
const uid = () => Math.random().toString(36).slice(2, 10);

function slotCountFor(form) {
  if (form.type === "token") {
    const n = parseInt(form.tokenCount, 10);
    return Number.isFinite(n) && n > 0 ? n : 1;
  }
  return 1; // adhoc = single one-off job
}
function buildSlots(form, existing = []) {
  if (form.type === "token") return []; // token requests are a running balance, not per-token dated visits
  const count = slotCountFor(form);
  const out = [];
  for (let i = 0; i < count; i++) {
    out.push(existing[i] ? existing[i] : { id: uid(), date: null, completed: false });
  }
  return out;
}

function csvEscape(val) {
  const s = val == null ? "" : String(val);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function toCsv(rows) {
  return rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
}
function downloadCsv(filename, rows) {
  const blob = new Blob([toCsv(rows)], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const BUSINESS_HOURS_START = "09:00";
const BUSINESS_HOURS_END = "18:00";
function deriveHourTier(requestDate, startTime) {
  if (!requestDate || !startTime) return null;
  const day = parseD(requestDate).getDay(); // 0 = Sun, 6 = Sat
  if (day === 0 || day === 6) return "weekend";
  return (startTime >= BUSINESS_HOURS_START && startTime < BUSINESS_HOURS_END) ? "weekday_biz" : "weekday_after";
}
function hoursBetween(startTime, endTime) {
  if (!startTime || !endTime) return null;
  const [sh, sm] = startTime.split(":").map(Number);
  const [eh, em] = endTime.split(":").map(Number);
  const mins = (eh * 60 + em) - (sh * 60 + sm);
  return mins > 0 ? mins / 60 : null;
}
// deducts hours worked (start->end) from the typed token count, but only when the
// start/end time is newly set or changed vs. what's already stored -- editing a
// token request without touching the time fields must not deduct the same job twice.
function finalTokenCountFor(form, existing) {
  const n = parseInt(form.tokenCount, 10);
  const base = Number.isFinite(n) && n > 0 ? n : 1;
  const prevStart = existing ? (existing.startTime || "") : "";
  const prevEnd = existing ? (existing.endTime || "") : "";
  if (form.startTime === prevStart && form.endTime === prevEnd) return base;
  const hrs = hoursBetween(form.startTime, form.endTime);
  if (hrs == null) return base;
  return Math.round(Math.max(0, base - hrs) * 100) / 100;
}

        }
      } catch (e) {}
      try {
        const remoteRates = await kvGet(KV_RATE_CARD);
        const remoteRatesJson = remoteRates ? JSON.stringify(remoteRates) : "";
        if (remoteRatesJson && remoteRatesJson !== lastRateSyncedRef.current) {
          lastRateSyncedRef.current = remoteRatesJson;
          setRateCard(remoteRates);
        }
      } catch (e) {}
      try {
        const remoteClients = await kvGet(KV_CLIENTS);
        const remoteClientsJson = remoteClients ? JSON.stringify(remoteClients) : "";
        if (remoteClientsJson && remoteClientsJson !== lastClientsSyncedRef.current) {
          lastClientsSyncedRef.current = remoteClientsJson;
          setClientsList(remoteClients);
        }
      } catch (e) {}
      try {
        const { data, error } = await sb.from("profiles").select("*");
        if (error) throw error;
        const mapped = (data || []).map(mapProfile);
        const mappedJson = JSON.stringify(mapped);
        if (mappedJson !== lastUsersSyncedRef.current) {
          lastUsersSyncedRef.current = mappedJson;
          setUsers(mapped);
        }
      } catch (e) {}
      try {
        const remoteActivity = await kvGet(KV_ACTIVITY);
        const remoteActivityJson = remoteActivity ? JSON.stringify(remoteActivity) : "";
        if (remoteActivityJson && remoteActivityJson !== lastActivitySyncedRef.current) {
          lastActivitySyncedRef.current = remoteActivityJson;
          setActivity(remoteActivity);
        }
      } catch (e) {}
      try {
        const remotePresence = await kvGet(KV_PRESENCE);
        const remotePresenceJson = remotePresence ? JSON.stringify(remotePresence) : "";
        if (remotePresenceJson && remotePresenceJson !== lastPresenceSyncedRef.current) {
          lastPresenceSyncedRef.current = remotePresenceJson;
          setPresence(remotePresence);
        }
      } catch (e) {}
    }, 10000);
    return () => clearInterval(interval);
  }, [loaded]);

  const logActivity = (action, detail) => {
    if (!currentUser) return;
    setActivity(a => {
      const entry = { id: uid(), ts: new Date().toISOString(), userId: currentUser.id, name: fullName(currentUser), role: currentUser.role, action, detail };
      const next = [...a, entry];
      return next.length > 300 ? next.slice(next.length - 300) : next;
    });
  };

  // logActivity needs the *new* user before React state updates flow through,
  // so the post-login path uses this variant with an explicit user object
  const logActivityFor = (user, action, detail) => {
    setActivity(a => {
      const entry = { id: uid(), ts: new Date().toISOString(), userId: user.id, name: fullName(user), role: user.role, action, detail };
      const next = [...a, entry];
      return next.length > 300 ? next.slice(next.length - 300) : next;
    });
  };

  const submitAuth = async () => {
    setAuthError("");

    setAuthBusy(true);
    try {
      if (authMode === "register") {
        if (!authFirst.trim() || !authLast.trim()) { setAuthError("Please enter your first and last name."); return; }
        if (authPassword.length < 6) { setAuthError("Choose a password of at least 6 characters."); return; }
        const { error } = await sb.auth.signUp({
          email: authEmail.trim(),
          password: authPassword,
          options: { data: { first_name: authFirst.trim(), last_name: authLast.trim() } }
        });
        if (error) { setAuthError(error.message); return; }
        setAuthNotice("Check your email to confirm your account, then log in.");
        setAuthMode("login");
        setAuthPassword("");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: authEmail.trim(), password: authPassword });
        if (error) { setAuthError(error.message); return; }
        setAuthPassword("");

    } finally {
      setAuthBusy(false);
    }
  };
  const logout = async () => {
    if (currentUser) logActivity("logout", `${fullName(currentUser)} logged out`);
    try {
      const remote = (await kvGet(KV_PRESENCE)) || {};
      if (currentUserId) delete remote[currentUserId];
      await kvSet(KV_PRESENCE, remote);
      setPresence(remote);
    } catch (e) {}
    await sb.auth.signOut();
  };
  const setUserRole = async (userId, newRole) => {
    if (!isSuperAdmin) return;
    const target = users.find(u => u.id === userId);
    try {
      const { data, error } = await sb.rpc("set_user_role", { target_id: userId, new_role: newRole });
      if (error || !data) return;
      setUsers(us => us.map(u => u.id === userId ? { ...u, role: newRole } : u));

  };

  const openAdd = () => {
    if (!isAdmin) return;
    setForm(emptyForm);
    setEditingId(null);
    setFieldErrors({});
    setFormSaveError("");
    setIncludeRateInputs(false);
    setRateInputs(emptyRateInputs);
    setRateInputErrors({});
    setModalOpen(true);
  };
  const openEdit = r => {
    if (!isAdmin) return;
    setIncludeRateInputs(false);
    setRateInputs(emptyRateInputs);
    setRateInputErrors({});
    setForm({
      refNo: r.refNo,
      client: r.client,
      city: r.city || "",
      address: r.address,
      region: r.region || "",
      scope: r.scope || "",
      type: r.type,
      tokenCount: String(r.tokenCount || 5),
      requestDate: r.requestDate,
      startTime: r.startTime || "",
      endTime: r.endTime || ""
    });
    setEditingId(r.id);
    setFieldErrors({});
    setFormSaveError("");
    setModalOpen(true);
  };
  const saveForm = async () => {
    if (!isAdmin) return;
    const errs = {};
    if (!form.refNo.trim()) errs.refNo = "Please fill in reference no";
    if (!form.client.trim()) errs.client = "Please fill in client";
    if (!form.city.trim()) errs.city = "Please fill in city";
    if (!form.address.trim()) errs.address = "Please fill in address";
    if (!form.region.trim()) errs.region = "Please fill in region";
    if (!form.requestDate) errs.requestDate = "Please fill in request date";
    if (form.startTime && form.endTime && form.endTime <= form.startTime) errs.endTime = "End time must be after start time";
    if (form.type === "token") {
      const n = parseInt(form.tokenCount, 10);
      if (!Number.isFinite(n) || n < 1) errs.tokenCount = "Enter a token count of 1 or more";
    }
    setFieldErrors(errs);

    let rateErrs = {};
    let ratePayload = null;
    if (includeRateInputs) {
      const parseRate = val => val.trim() === "" ? null : Number(val);
      const bizH = parseRate(rateInputs.hourRateWeekdayBiz);
      const afterH = parseRate(rateInputs.hourRateWeekdayAfter);
      const weekendH = parseRate(rateInputs.hourRateWeekend);
      if (rateInputs.hourRateWeekdayBiz.trim() !== "" && (!Number.isFinite(bizH) || bizH < 0)) rateErrs.hourRateWeekdayBiz = "Enter a valid rate";
      if (rateInputs.hourRateWeekdayAfter.trim() !== "" && (!Number.isFinite(afterH) || afterH < 0)) rateErrs.hourRateWeekdayAfter = "Enter a valid rate";
      if (rateInputs.hourRateWeekend.trim() !== "" && (!Number.isFinite(weekendH) || weekendH < 0)) rateErrs.hourRateWeekend = "Enter a valid rate";
      setRateInputErrors(rateErrs);
      if (bizH != null || afterH != null || weekendH != null) {
        ratePayload = { hourRateWeekdayBiz: bizH, hourRateWeekdayAfter: afterH, hourRateWeekend: weekendH };
      }
    }

    if (Object.keys(errs).length > 0 || Object.keys(rateErrs).length > 0) return;

    let newRequests;
    if (editingId) {
      newRequests = requests.map(r => {
        if (r.id !== editingId) return r;
        const changed = r.type !== form.type || Number(form.tokenCount) !== r.tokenCount;
        const schedule = changed ? buildSlots(form, r.schedule || []) : r.schedule;
        const tokenCount = form.type === "token" ? finalTokenCountFor(form, r) : slotCountFor(form);
        return { ...r, ...form, tokenCount, schedule };
      });
    } else {
      const tokenCount = form.type === "token" ? finalTokenCountFor(form, null) : slotCountFor(form);
      newRequests = [...requests, { id: uid(), ...form, tokenCount, schedule: buildSlots(form, []) }];
    }

    let newRateCard = rateCard;
    if (ratePayload) {
      const existing = findRate(rateCard, form.client, form.city);
      newRateCard = existing
        ? rateCard.map(r => r.id !== existing.id ? r : { ...r, ...ratePayload })
        : [...rateCard, { id: uid(), client: form.client, city: form.city, ...ratePayload }];
    }

    let newClientsList = clientsList;
    if (includeRateInputs && form.client.trim()) {
      const clientName = form.client.trim();
      newClientsList = clientsList.some(c => c.trim().toLowerCase() === clientName.toLowerCase()) ? clientsList : [...clientsList, clientName];
    }

    setFormSaveError("");
    setSaving(true);
    try {
      await kvSet(KV_REQUESTS, newRequests);
      if (newRateCard !== rateCard) await kvSet(KV_RATE_CARD, newRateCard);
      if (newClientsList !== clientsList) await kvSet(KV_CLIENTS, newClientsList);

      setRequests(newRequests);
      lastSyncedRef.current = JSON.stringify(newRequests);
      if (newRateCard !== rateCard) { setRateCard(newRateCard); lastRateSyncedRef.current = JSON.stringify(newRateCard); }
      if (newClientsList !== clientsList) { setClientsList(newClientsList); lastClientsSyncedRef.current = JSON.stringify(newClientsList); }

      logActivity(editingId ? "edit-request" : "add-request", `${editingId ? "Edited" : "Added"} request ${form.refNo} for ${form.client}`);
      setModalOpen(false);
    } catch (e) {
      console.error("save request failed", e);
      setFormSaveError("Could not save — check your connection and try again. Your entered data is still here.");
    } finally {
      setSaving(false);
    }
  };
  const deleteRequest = async id => {
    if (!isAdmin) return;
    const target = requests.find(r => r.id === id);
    const newRequests = requests.filter(r => r.id !== id);
    setSaving(true);
    try {
      await kvSet(KV_REQUESTS, newRequests);
      setRequests(newRequests);
      lastSyncedRef.current = JSON.stringify(newRequests);
      setConfirmDelete(null);
      if (target) logActivity("delete-request", `Deleted request ${target.refNo} for ${target.client}`);
    } catch (e) {
      console.error("delete request failed", e);
      alert("Could not delete — check your connection and try again.");
    } finally {
      setSaving(false);
    }
  };
  const setSlotDate = (requestId, slotId, dateStr) => {

    setRequests(rs => rs.map(r => r.id !== requestId ? r : {
      ...r,
      schedule: r.schedule.map(s => s.id === slotId ? { ...s, date: dateStr || null } : s)
    }));
  };
  const toggleSlotDone = (requestId, slotId) => {

      schedule: r.schedule.map(s => s.id === slotId ? { ...s, completed: !s.completed } : s)
    }));

    });

    setRateSaveError("");
    setRateModalOpen(true);

  const openAddRate = () => {

    setEditingRateId(null);
    setRateFieldErrors({});
    setRateSaveError("");
    setRateModalOpen(true);

  const saveRateForm = async () => {

    const errs = {};

    if (!rateForm.city.trim()) errs.city = "Please fill in city";
    const dupe = rateCard.some(r =>
      r.id !== editingRateId &&
      r.client.trim().toLowerCase() === rateForm.client.trim().toLowerCase() &&
      (r.city || "").trim().toLowerCase() === rateForm.city.trim().toLowerCase()
    );
    if (dupe) errs.city = "A rate for this client + city already exists";
    const parseRate = val => val.trim() === "" ? null : Number(val);
    const bizH = parseRate(rateForm.hourRateWeekdayBiz);
    const afterH = parseRate(rateForm.hourRateWeekdayAfter);
    const weekendH = parseRate(rateForm.hourRateWeekend);
    if (rateForm.hourRateWeekdayBiz.trim() !== "" && (!Number.isFinite(bizH) || bizH < 0)) errs.hourRateWeekdayBiz = "Enter a valid rate";
    if (rateForm.hourRateWeekdayAfter.trim() !== "" && (!Number.isFinite(afterH) || afterH < 0)) errs.hourRateWeekdayAfter = "Enter a valid rate";
    if (rateForm.hourRateWeekend.trim() !== "" && (!Number.isFinite(weekendH) || weekendH < 0)) errs.hourRateWeekend = "Enter a valid rate";
    if (bizH === null && afterH === null && weekendH === null) {
      errs.hourRateWeekdayBiz = "Enter at least one rate";
    }
    setRateFieldErrors(errs);
    if (Object.keys(errs).length > 0) return;

    const payload = {
      client: rateForm.client, city: rateForm.city,
      hourRateWeekdayBiz: bizH, hourRateWeekdayAfter: afterH, hourRateWeekend: weekendH
    };
    const newRateCard = editingRateId
      ? rateCard.map(r => r.id !== editingRateId ? r : { ...r, ...payload })
      : [...rateCard, { id: uid(), ...payload }];

    setRateSaveError("");
    setSaving(true);
    try {
      await kvSet(KV_RATE_CARD, newRateCard);
      setRateCard(newRateCard);
      lastRateSyncedRef.current = JSON.stringify(newRateCard);
      logActivity("edit-rate", `Set rate card for ${rateForm.client} (${rateForm.city})`);
      setRateModalOpen(false);
    } catch (e) {
      console.error("save rate failed", e);
      setRateSaveError("Could not save — check your connection and try again. Your entered data is still here.");
    } finally {
      setSaving(false);
    }
  };
  const deleteRate = async id => {
    if (!isAdmin) return;
    const target = rateCard.find(r => r.id === id);
    const newRateCard = rateCard.filter(r => r.id !== id);
    setSaving(true);
    try {
      await kvSet(KV_RATE_CARD, newRateCard);
      setRateCard(newRateCard);
      lastRateSyncedRef.current = JSON.stringify(newRateCard);
      setConfirmDeleteRate(null);
      if (target) logActivity("delete-rate", `Removed rate card for ${target.client}`);
    } catch (e) {
      console.error("delete rate failed", e);
      alert("Could not delete — check your connection and try again.");
    } finally {
      setSaving(false);
    }
  };

  const openTopUp = () => {

    setTopUpAmount("");
    setTopUpError("");
    setTopUpModalOpen(true);
  };
  const goToNewClientTopUp = () => {

    setForm({ ...emptyForm, type: "token" });

  const submitTopUp = async () => {
    if (!isAdmin) return;
    if (!topUpRequestId) { setTopUpError("Please select a client / request to top up."); return; }
    const amount = parseInt(topUpAmount, 10);
    if (!Number.isFinite(amount) || amount < 1) { setTopUpError("Enter a top-up amount of 1 or more."); return; }
    const target = requests.find(r => r.id === topUpRequestId);
    const newRequests = requests.map(r => r.id !== topUpRequestId ? r : { ...r, tokenCount: (r.tokenCount || 0) + amount });

    setTopUpError("");

    try {

      setRequests(newRequests);
      lastSyncedRef.current = JSON.stringify(newRequests);
      if (target) logActivity("top-up", `Topped up ${amount} token${amount > 1 ? "s" : ""} for ${target.client} (${target.refNo})`);
      setTopUpModalOpen(false);
    } catch (e) {
      console.error("top up failed", e);
      setTopUpError("Could not save — check your connection and try again.");
    } finally {
      setSaving(false);
    }
  };

  const enriched = useMemo(() => requests.map(r => {
    const schedule = (r.schedule || []).map(s => ({ ...s, status: slotStatus(s) }));
    const pending = schedule.filter(s => !s.completed);
    const nextTwo = pending.slice(0, 2);
    const overdueCount = schedule.filter(s => s.status === "overdue").length;
    const dueSoonCount = schedule.filter(s => s.status === "due-soon").length;
    const completedCount = schedule.filter(s => s.completed).length;
    // token requests are a running balance with no "done" state, so they always count as open
    const remaining = r.type === "token" ? 1 : schedule.length - completedCount;
    const rate = r.type === "token" ? findRate(rateCard, r.client, r.city) : null;
    const hourTier = r.type === "token" ? deriveHourTier(r.requestDate, r.startTime) : null;
    const durationHours = r.type === "token" ? hoursBetween(r.startTime, r.endTime) : null;
    let unitRate = null;
    if (rate && hourTier) {
      const tier = HOUR_TIERS.find(t => t.value === hourTier) || HOUR_TIERS[0];
      unitRate = rate[tier.rateField];
    }
    const estCost = (unitRate != null && durationHours != null) ? unitRate * durationHours : null;
    return { ...r, schedule, nextTwo, overdueCount, dueSoonCount, completedCount, remaining, hourTier, durationHours, unitRate, estCost };
  }), [requests, rateCard]);

  const upcomingFeed = useMemo(() => {

    enriched.forEach(r => {

          requestId: r.id, slotId: s.id, refNo: r.refNo, client: r.client,
          address: r.address, region: r.region, date: s.date, status: s.status
        });

  }, [enriched]);

  const openRequests = useMemo(() =>
    enriched.filter(r => r.type === "adhoc" && r.remaining > 0).sort((a, b) => a.requestDate < b.requestDate ? 1 : a.requestDate > b.requestDate ? -1 : 0),
  [enriched]);
  const activeTokenRequests = useMemo(() =>
    enriched.filter(r => r.type === "token").sort((a, b) => a.requestDate < b.requestDate ? 1 : a.requestDate > b.requestDate ? -1 : 0),
  [enriched]);
  const completedRequests = useMemo(() =>
    enriched.filter(r => r.remaining === 0).sort((a, b) => a.requestDate < b.requestDate ? 1 : a.requestDate > b.requestDate ? -1 : 0),
  [enriched]);

  const stats = useMemo(() => {
    const open = enriched.filter(r => r.type === "adhoc" && r.remaining > 0).length;
    const activeTokens = enriched.filter(r => r.type === "token").length;
    return { open, activeTokens };
  }, [enriched]);

  const onlineUsers = useMemo(() => {
    const now = Date.now();
    return Object.entries(presence)
      .filter(([id, p]) => now - new Date(p.lastSeen).getTime() < PRESENCE_WINDOW_MS)
      .map(([id, p]) => ({ id, ...p }))
      .sort((a, b) => fullName(a).localeCompare(fullName(b)));
  }, [presence]);

  const exportRequestsCsv = () => {
    if (!isAdmin) return;

    const rows = enriched.map(r => {

        ? (HOUR_TIERS.find(t => t.value === r.hourTier) || HOUR_TIERS[0]).label
        : "";
      return [
        r.refNo, r.client, r.city || "", r.address, r.region || "",
        isTok ? "Token" : "Adhoc",
        tokenUnitLabel,
        isTok ? r.tokenCount : "",
        isTok && r.unitRate != null ? r.unitRate : "",
        isTok && r.estCost != null ? r.estCost : "",
        r.requestDate,
        r.startTime || "",
        r.endTime || "",
        r.scope || ""
      ];
    });
    downloadCsv(`adhoc-token-requests-${todayStr()}.csv`, [header, ...rows]);
    logActivity("export-csv", `Exported ${rows.length} request${rows.length === 1 ? "" : "s"} to CSV`);
  };

  if (!authReady) {
    return (
      <div style={{ minHeight: "100vh", background: "#0B0E0C", display: "flex", alignItems: "center", justifyContent: "center", color: "#8B948E", fontFamily: "'Space Grotesk', sans-serif" }}>
        Loading…
      </div>
    );

    return (
      <div style={{ minHeight: "100vh", background: "#0B0E0C", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, color: "#E8ECE9", fontFamily: "'Space Grotesk', sans-serif" }}>
        <div style={{ width: "100%", maxWidth: 420, background: "#0E1210", border: "1px solid #1E2320", borderRadius: 14, padding: 28 }}>

          <div className="mono" style={{ fontSize: 10.5, letterSpacing: 1.5, color: "#8B948E", marginBottom: 22 }}>GLOBAL VISION MULTIMEDIA · A RICOH COMPANY</div>

          <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
            {[["login", "Log In"], ["register", "Register"]].map(([tab, label]) => (
              <button key={tab} type="button" className="type-btn" onClick={() => { setAuthMode(tab); setAuthError(""); setAuthNotice(""); }}
                style={{

                  border: authMode === tab ? "1px solid #4ADE9C" : "1px solid #262B27",

            <Field label="Email">

            <button onClick={submitAuth} disabled={authBusy}

  return (

              <React.Fragment>
                {requests.filter(r => r.type === "token").length === 0 ? (
                  <div className="mono" style={{ fontSize: 12, color: "#8B948E" }}>No token requests on file yet — start with a new client instead.</div>
                ) : (
                  <React.Fragment>
                    <Field label="Client / request">
                      <select value={topUpRequestId} onChange={e => { setTopUpRequestId(e.target.value); setTopUpError(""); }} style={selectStyle}>
                        <option value="">Please select a request</option>
                        {requests.filter(r => r.type === "token").map(r => (
                          <option key={r.id} value={r.id}>{r.client} · {r.refNo} (balance: {r.tokenCount})</option>
                        ))}
                      </select>
                    </Field>
                    <Field label="Amount to top up">
                      <input type="number" min="1" value={topUpAmount}
                        onChange={e => { setTopUpAmount(e.target.value); setTopUpError(""); }}
                        style={inputStyle} placeholder="E.G. 5" />
                    </Field>
                  </React.Fragment>
                )}
              </React.Fragment>
            )}
            {topUpError && <div style={{ color: "#F2545B", fontSize: 11.5 }}>{topUpError}</div>}
          </div>

          <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
            {topUpMode === "new" ? (
              <button onClick={goToNewClientTopUp} style={{ flex: 1, background: "#4ADE9C", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14 }}>
                Continue to Add Request
              </button>
            ) : (
              <button onClick={submitTopUp} disabled={saving || requests.filter(r => r.type === "token").length === 0}
                style={{ flex: 1, background: "#4ADE9C", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14, opacity: (saving || requests.filter(r => r.type === "token").length === 0) ? 0.5 : 1 }}>
                {saving ? "Saving…" : "Top up"}
              </button>
            )}
            <button onClick={() => setTopUpModalOpen(false)} disabled={saving} style={{ background: "transparent", color: "#8B948E", border: "1px solid #262B27", borderRadius: 8, padding: "11px 18px", fontSize: 14 }}>Cancel</button>
          </div>
        </Modal>
      )}

      {modalOpen && (
        <Modal onClose={() => setModalOpen(false)}>
          <h2 style={{ margin: "0 0 18px", fontSize: 18, fontWeight: 700 }}>{editingId ? "Edit Request" : "Add Request"}</h2>
          <div style={{ display: "grid", gap: 14 }}>
            <Field label="Reference No." error={fieldErrors.refNo}>
              <TextInput value={form.refNo} onChange={v => setForm({ ...form, refNo: v })} placeholder="E.G. GVMS01234 / IN1234 / CS4321" uppercase error={!!fieldErrors.refNo} />
            </Field>
            <Field label="Region" error={fieldErrors.region}>
              <select value={form.region} onChange={e => setForm({ ...form, region: e.target.value })}
                style={fieldErrors.region ? { ...selectStyle, border: "1px solid #F2545B", textTransform: "uppercase" } : { ...selectStyle, textTransform: "uppercase" }}>
                <option value="">Select a country</option>
                {COUNTRIES.map(country => <option key={country} value={country}>{country}</option>)}
              </select>
            </Field>
            <Field label="Client" error={fieldErrors.client}>
              {includeRateInputs ? (
                <React.Fragment>
                  <TextInput value={form.client} onChange={v => setForm({ ...form, client: v })} placeholder="ENTER NEW CLIENT NAME" uppercase error={!!fieldErrors.client} />
                  <div className="mono" style={{ fontSize: 10.5, color: "#8B948E", marginTop: 6 }}>
                    New client — this will be added to the client list once saved.
                  </div>
                </React.Fragment>
              ) : (
                <select value={form.client} onChange={e => setForm({ ...form, client: e.target.value, city: "" })}
                  style={fieldErrors.client ? { ...selectStyle, border: "1px solid #F2545B" } : selectStyle}>
                  <option value="">Please select client</option>
                  {clientsList.map(client => <option key={client} value={client}>{client}</option>)}
                </select>
              )}
            </Field>
            {!includeRateInputs && (
              <Field label="City" error={fieldErrors.city}>
                <CitySelect value={form.city} onChange={v => setForm({ ...form, city: v })} options={allCities(rateCard)}
                  error={!!fieldErrors.city} />
                <div className="mono" style={{ fontSize: 10.5, color: "#8B948E", marginTop: 6 }}>
                  Rate is matched by client + city.
                </div>
              </Field>
            )}
            <Field label="Site Address" error={fieldErrors.address}>
              <TextInput value={form.address} onChange={v => setForm({ ...form, address: v })} placeholder="E.G. XYZ STREET 12" uppercase error={!!fieldErrors.address} />
            </Field>
            <Field label="Description">
              <textarea value={form.scope} onChange={e => setForm({ ...form, scope: e.target.value.toUpperCase() })}
                placeholder="DESCRIBE THE JOB / SCOPE OF WORK"
                rows={3} style={{ ...inputStyle, resize: "vertical", fontFamily: "'Space Grotesk', sans-serif" }} />
            </Field>

            <Field label="Request type">
              <div style={{ display: "flex", gap: 8 }}>
                <button type="button" className="type-btn" onClick={() => setForm({ ...form, type: "adhoc" })}
                  style={{
                    flex: 1, padding: "12px 0", borderRadius: 8, fontWeight: 600, fontSize: 14,
                    border: form.type === "adhoc" ? "1px solid #4ADE9C" : "1px solid #262B27",
                    background: form.type === "adhoc" ? "#4ADE9C22" : "transparent",
                    color: form.type === "adhoc" ? "#4ADE9C" : "#8B948E"
                  }}>Adhoc</button>
                <button type="button" className="type-btn" onClick={() => setForm({ ...form, type: "token" })}
                  style={{
                    flex: 1, padding: "12px 0", borderRadius: 8, fontWeight: 600, fontSize: 14,
                    border: form.type === "token" ? "1px solid #6E9FB0" : "1px solid #262B27",
                    background: form.type === "token" ? "#6E9FB022" : "transparent",
                    color: form.type === "token" ? "#6E9FB0" : "#8B948E"
                  }}>Token</button>
              </div>
            </Field>

            {form.type === "token" && (
              <Field label="Amount of Tokens" error={fieldErrors.tokenCount}>
                <input type="number" min="1" value={form.tokenCount}
                  onChange={e => setForm({ ...form, tokenCount: e.target.value })}
                  style={fieldErrors.tokenCount ? { ...inputStyle, border: "1px solid #F2545B" } : inputStyle} />
              </Field>
            )}

            {includeRateInputs && (
              <div style={{ border: "1px solid #4ADE9C33", borderRadius: 10, padding: 14, display: "grid", gap: 12 }}>
                <div className="mono" style={{ fontSize: 11, color: "#4ADE9C", letterSpacing: 0.5 }}>RATE CARD FOR THIS CLIENT + CITY</div>
                <div className="mono" style={{ fontSize: 10.5, color: "#8B948E", marginTop: -6 }}>
                  Optional — fill in whichever hourly rates apply. This saves straight to the Rate Card.
                </div>
                <Field label="City" error={fieldErrors.city}>
                  <TextInput value={form.city} onChange={v => setForm({ ...form, city: v })} placeholder="E.G. TOKYO" uppercase error={!!fieldErrors.city} />
                </Field>
                <Field label="Amount ($) per hour · Weekday Business Hours" error={rateInputErrors.hourRateWeekdayBiz}>
                  <input type="number" min="0" step="0.01" value={rateInputs.hourRateWeekdayBiz}
                    onChange={e => setRateInputs({ ...rateInputs, hourRateWeekdayBiz: e.target.value })}
                    style={rateInputErrors.hourRateWeekdayBiz ? { ...inputStyle, border: "1px solid #F2545B" } : inputStyle} />
                </Field>
                <Field label="Amount ($) per hour · Weekday After Office Hours" error={rateInputErrors.hourRateWeekdayAfter}>
                  <input type="number" min="0" step="0.01" value={rateInputs.hourRateWeekdayAfter}
                    onChange={e => setRateInputs({ ...rateInputs, hourRateWeekdayAfter: e.target.value })}
                    style={rateInputErrors.hourRateWeekdayAfter ? { ...inputStyle, border: "1px solid #F2545B" } : inputStyle} />
                </Field>
                <Field label="Amount ($) per hour · Weekend" error={rateInputErrors.hourRateWeekend}>
                  <input type="number" min="0" step="0.01" value={rateInputs.hourRateWeekend}
                    onChange={e => setRateInputs({ ...rateInputs, hourRateWeekend: e.target.value })}
                    style={rateInputErrors.hourRateWeekend ? { ...inputStyle, border: "1px solid #F2545B" } : inputStyle} />
                </Field>
              </div>
            )}

            {!includeRateInputs && (
              <Field label="Request date" error={fieldErrors.requestDate}>
                <TextInput type="date" value={form.requestDate} onChange={v => setForm({ ...form, requestDate: v })} error={!!fieldErrors.requestDate} />
              </Field>
            )}
            {!includeRateInputs && (
              <div style={{ display: "flex", gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <Field label="Start time" error={fieldErrors.startTime}>
                    <TextInput type="time" value={form.startTime} onChange={v => setForm({ ...form, startTime: v })} error={!!fieldErrors.startTime} />
                  </Field>
                </div>
                <div style={{ flex: 1 }}>
                  <Field label="End time" error={fieldErrors.endTime}>
                    <TextInput type="time" value={form.endTime} onChange={v => setForm({ ...form, endTime: v })} error={!!fieldErrors.endTime} />
                  </Field>
                </div>
              </div>
            )}
            {!includeRateInputs && form.type === "token" && (() => {
              const tier = deriveHourTier(form.requestDate, form.startTime);
              const hours = hoursBetween(form.startTime, form.endTime);
              if (!tier || hours == null) return (
                <div className="mono" style={{ fontSize: 10.5, color: "#8B948E" }}>
                  Fill in start and end time to see the rate tier and estimated cost.
                </div>
              );
              const tierInfo = HOUR_TIERS.find(t => t.value === tier) || HOUR_TIERS[0];
              const matched = findRate(rateCard, form.client, form.city);
              const rate = matched ? matched[tierInfo.rateField] : null;
              const existing = editingId ? requests.find(rq => rq.id === editingId) : null;
              const finalCount = finalTokenCountFor(form, existing);
              const willDeduct = finalCount !== (parseInt(form.tokenCount, 10) || 0);
              return (
                <div className="mono" style={{ fontSize: 10.5, color: "#6E9FB0" }}>
                  <div>
                    {tierInfo.label} · {hours}h
                    {rate != null
                      ? ` · rate on file: ${rate}/hr · est. ${(rate * hours).toLocaleString()} total`
                      : " · no rate on file for this client/city + tier."}
                  </div>
                  {willDeduct && (
                    <div style={{ marginTop: 3, color: "#4ADE9C" }}>
                      Balance on save: {finalCount.toLocaleString()} ({form.tokenCount} − {hours}h worked)
                    </div>
                  )}
                </div>
              );
            })()}
            {formSaveError && <div style={{ color: "#F2545B", fontSize: 12.5 }}>{formSaveError}</div>}
          </div>

          <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
            <button onClick={saveForm} disabled={saving} style={{ flex: 1, background: "#4ADE9C", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14, opacity: saving ? 0.6 : 1 }}>
              {saving ? "Saving…" : editingId ? "Save changes" : "Add request"}
            </button>
            <button onClick={() => setModalOpen(false)} disabled={saving} style={{ background: "transparent", color: "#8B948E", border: "1px solid #262B27", borderRadius: 8, padding: "11px 18px", fontSize: 14 }}>Cancel</button>
          </div>
        </Modal>
      )}

      {confirmDelete && (
        <Modal onClose={() => setConfirmDelete(null)} narrow>
          <h2 style={{ margin: "0 0 10px", fontSize: 16, fontWeight: 700 }}>Delete this request?</h2>
          <p style={{ color: "#8B948E", fontSize: 13, margin: "0 0 20px" }}>This removes the request and its visit history. This can't be undone.</p>
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={() => deleteRequest(confirmDelete)} disabled={saving} style={{ flex: 1, background: "#F2545B", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14, opacity: saving ? 0.6 : 1 }}>
              {saving ? "Deleting…" : "Delete"}
            </button>
            <button onClick={() => setConfirmDelete(null)} disabled={saving} style={{ background: "transparent", color: "#8B948E", border: "1px solid #262B27", borderRadius: 8, padding: "11px 18px", fontSize: 14 }}>Cancel</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function StatBox({ label, value, color }) {
  return (
    <div style={{ background: "#0E1210", border: "1px solid #1E2320", borderRadius: 10, padding: "14px 16px" }}>
      <div className="mono" style={{ fontSize: 10, letterSpacing: 1.5, color: "#8B948E", marginBottom: 6 }}>{label}</div>
      <div className="mono" style={{ fontSize: 26, fontWeight: 700, color }}>{value}</div>
    </div>
  );
}
function SectionHeader({ title, sub }) {
  return (
    <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 14 }}>
      <h2 style={{ fontSize: 17, fontWeight: 700, margin: 0 }}>{title}</h2>
      <span className="mono" style={{ fontSize: 11, color: "#8B948E" }}>{sub}</span>
    </div>
  );
}
function EmptyRow({ text }) {
  return <div style={{ border: "1px dashed #262B27", borderRadius: 10, padding: "28px 20px", textAlign: "center", color: "#8B948E", fontSize: 13 }}>{text}</div>;
}

function RequestCard({ r, isAdmin, isUser, onEdit, onDelete, onSetDate, onToggleDone }) {
  const complete = r.remaining === 0;
  const ledColor = r.overdueCount > 0 ? "#F2545B" : r.dueSoonCount > 0 ? "#F5A623" : "#4ADE9C";
  const isToken = r.type === "token";

  return (
    <div style={{ background: "#0E1210", border: "1px solid #1E2320", borderRadius: 12, padding: "16px 18px", position: "relative" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
        <div style={{ display: "flex", gap: 10, minWidth: 0 }}>
          <div className="jack jack-glow" style={{ background: ledColor, color: ledColor, marginTop: 6 }} />
          <div style={{ minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 15, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.client || "Untitled client"}</div>
            <div className="mono" style={{ fontSize: 11, color: "#8B948E" }}>{r.refNo}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
          {isAdmin && (
            <React.Fragment>
              <IconBtn onClick={onEdit}><Pencil size={13} /></IconBtn>
              <IconBtn onClick={onDelete}><Trash2 size={13} /></IconBtn>
            </React.Fragment>
          )}
        </div>
      </div>

      <div style={{ fontSize: 12.5, color: "#8B948E", margin: "10px 0", lineHeight: 1.5 }}>
        {r.address || "No address specified"}
        {r.city && <span className="mono" style={{ color: "#4ADE9C" }}> · {r.city.toUpperCase()}</span>}
        {r.region && <span className="mono" style={{ color: "#6E9FB0" }}> · {r.region.toUpperCase()}</span>}
      </div>
      {isToken ? (
        <div style={{ display: "flex", alignItems: "center", gap: 5, margin: "-4px 0 10px", color: "#4ADE9C", fontSize: 11.5, fontWeight: 600 }}>
          <span className="jack jack-glow" style={{ background: "#4ADE9C", color: "#4ADE9C", width: 6, height: 6 }} /> ACTIVE TOKEN
        </div>
      ) : r.scope && (
        <div style={{ fontSize: 12, color: "#8B948E", margin: "-4px 0 10px", lineHeight: 1.5, fontStyle: "italic" }}>
          {r.scope}
        </div>
      )}

      <div style={{ display: "flex", gap: 16, fontSize: 12 }}>
        <div>
          <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>TYPE</div>
          <div className="mono" style={{ display: "flex", alignItems: "center", gap: 5, color: isToken ? "#6E9FB0" : "#4ADE9C" }}>
            <Ticket size={12} /> {isToken
              ? `TOKEN × ${r.tokenCount}${r.hourTier ? " · " + (HOUR_TIERS.find(t => t.value === r.hourTier) || HOUR_TIERS[0]).label.toUpperCase() : ""}`
              : "ADHOC"}
          </div>
        </div>
        <div>
          <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>REQUESTED</div>
          <div className="mono">{fmtShort(r.requestDate)}</div>
        </div>
        {(r.startTime || r.endTime) && (
          <div>
            <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>TIME</div>
            <div className="mono">{r.startTime || "?"} – {r.endTime || "?"}</div>
          </div>
        )}
        {isToken && (
          <div>
            <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>TOKEN BALANCE</div>
            <div className="mono" style={{ color: "#4ADE9C" }}>{r.tokenCount}</div>
          </div>
        )}
        {isToken && r.estCost != null && (
          <div>
            <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>EST. COST</div>
            <div className="mono" style={{ color: "#4ADE9C" }}>{r.estCost.toLocaleString()}</div>
          </div>
        )}
      </div>

      {r.overdueCount > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, color: "#F2545B", fontSize: 11 }}>
          <AlertTriangle size={12} /> {r.overdueCount} visit{r.overdueCount > 1 ? "s" : ""} overdue
        </div>
      )}
      {r.overdueCount === 0 && r.dueSoonCount > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, color: "#F5A623", fontSize: 11 }}>
          <Clock size={12} /> {r.dueSoonCount} visit{r.dueSoonCount > 1 ? "s" : ""} due soon
        </div>
      )}

      {isUser && !isToken && r.schedule.length > 0 && (
        <div style={{ marginTop: 14, borderTop: "1px solid #1E2320", paddingTop: 12 }}>
          <div className="mono" style={{ fontSize: 10, letterSpacing: 1, color: "#8B948E", marginBottom: 8 }}>
            STATUS
          </div>
          {r.nextTwo.length === 0 ? (
            <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#4ADE9C", fontSize: 12.5 }}>
              <CheckCircle2 size={13} /> Request completed
            </div>
          ) : (
            <div style={{ display: "grid", gap: 10 }}>
              {r.nextTwo.map((s, i) => (
                <div key={s.id}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                      <div className="jack jack-glow" style={{ background: STATUS_COLOR[s.status], color: STATUS_COLOR[s.status] }} />
                      <span className="mono" style={{ fontSize: 10, color: "#8B948E" }}>{i === 0 ? "NEXT" : "THEN"}</span>
                      {isAdmin ? (
                        <input type="date" value={s.date || ""} onChange={e => onSetDate(r.id, s.id, e.target.value)}
                          onClick={e => { if (e.target.showPicker) { try { e.target.showPicker(); } catch (err) {} } }}
                          style={dateInputStyle} />
                      ) : (
                        <span className="mono" style={{ fontSize: 12, color: s.date ? "#E8ECE9" : "#F5A623" }}>{s.date ? fmtShort(s.date) : "No date set"}</span>
                      )}
                    </div>
                    {isAdmin && (
                      <button onClick={() => onToggleDone(r.id, s.id)} disabled={!s.date} title={s.date ? "Mark complete" : "Select a date first"}
                        style={{ background: "transparent", border: "1px solid #262B27", borderRadius: 6, padding: "5px 9px", color: s.date ? "#4ADE9C" : "#3A423C", display: "flex", alignItems: "center", gap: 5, fontSize: 11, opacity: s.date ? 1 : 0.6, cursor: s.date ? "pointer" : "not-allowed", flexShrink: 0 }}>
                        <CheckCircle2 size={12} /> Done
                      </button>
                    )}
                  </div>
                  {isAdmin && !s.date && <div style={{ color: "#F5A623", fontSize: 11, marginTop: 4, marginLeft: 18 }}>Please select a date</div>}
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function IconBtn({ children, onClick }) {
  return <button onClick={onClick} style={{ background: "transparent", border: "1px solid #262B27", borderRadius: 6, padding: 6, color: "#8B948E", display: "flex" }}>{children}</button>;
}
function Modal({ children, onClose, narrow }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }}>
      <div onClick={e => e.stopPropagation()} className="scrollbar" style={{ background: "#0E1210", border: "1px solid #262B27", borderRadius: 14, padding: 24, width: "100%", maxWidth: narrow ? 380 : 460, maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "flex-end" }}>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#8B948E", marginTop: -8, marginRight: -8 }}><XIcon size={18} /></button>
        </div>
        <div style={{ marginTop: -28 }}>{children}</div>
      </div>
    </div>
  );
}
function Field({ label, children, error }) {
  return (
    <div>
      <label className="mono" style={{ fontSize: 11, color: error ? "#F2545B" : "#8B948E", display: "block", marginBottom: 6, letterSpacing: 0.5 }}>{label.toUpperCase()}</label>
      {children}
      {error && <div style={{ color: "#F2545B", fontSize: 11.5, marginTop: 5 }}>{error}</div>}
    </div>
  );
}
const inputStyle = { width: "100%", background: "#0B0E0C", border: "1px solid #262B27", borderRadius: 7, padding: "10px 12px", color: "#E8ECE9", fontSize: 14, outline: "none", colorScheme: "dark" };
const selectStyle = { ...inputStyle, appearance: "auto" };
const dateInputStyle = { background: "#0B0E0C", border: "1px solid #262B27", borderRadius: 6, padding: "5px 8px", color: "#E8ECE9", fontSize: 12, fontFamily: "'JetBrains Mono', monospace", colorScheme: "dark", outline: "none", minWidth: 140, cursor: "pointer" };

function CitySelect({ value, onChange, options, error }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)}
      style={error ? { ...selectStyle, border: "1px solid #F2545B", textTransform: "uppercase" } : { ...selectStyle, textTransform: "uppercase" }}>
      <option value="">Select a city</option>
      {options.map(c => <option key={c} value={c}>{c}</option>)}
    </select>
  );
}
function TextInput({ value, onChange, placeholder, type = "text", uppercase = false, error = false }) {
  const base = uppercase ? { ...inputStyle, textTransform: "uppercase" } : inputStyle;
  const withCursor = (type === "date" || type === "time") ? { ...base, cursor: "pointer" } : base;
  return (
    <input type={type} value={value} onChange={e => onChange(uppercase ? e.target.value.toUpperCase() : e.target.value)}
      onClick={e => { if ((type === "date" || type === "time") && e.target.showPicker) { try { e.target.showPicker(); } catch (err) {} } }}
      placeholder={placeholder} style={error ? { ...withCursor, border: "1px solid #F2545B" } : withCursor} />
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Dashboard />);
</script>
</body>
</html>
